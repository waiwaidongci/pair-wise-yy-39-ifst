<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大坝巡检、缺陷与应急管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}input{padding:.45rem;margin-right:.5rem}</style></head><body><h1>大坝巡检、缺陷与应急管理</h1><p>安排巡检，记录渗流、位移、裂缝等缺陷并跟踪修复、复检和应急预案。</p><p>列表、详情、记录、状态流转与审计按 <b>X-Office</b> 管理处隔离；历史未认领缺陷仅管理员经映射回填或指定负责人认领后才开放。</p><label>管理处 <input id="office" value="office-a"></label><button onclick="loadItems()">刷新列表</button><pre id="out">使用X-Actor、X-Role和X-Office请求头调用接口。</pre><script>async function loadItems(){const office=document.getElementById('office').value.trim();const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer','X-Office':office}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
